<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="#111827"/>

  <!-- Subtle horizontal track lines -->
  <g stroke="#1F2937" stroke-width="0.5" opacity="0.35">
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="280" x2="400" y2="280"/>
  </g>

  <!-- Mark: input rails -->
  <path d="M 60,140 C 120,140 150,172 195,185" stroke="#6B7280" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M 60,200 L 195,200" stroke="#6B7280" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M 60,260 C 120,260 150,228 195,215" stroke="#6B7280" stroke-width="4.5" fill="none" stroke-linecap="round"/>

  <!-- Node ambient glow -->
  <circle cx="210" cy="200" r="28" fill="#F59E0B" opacity="0.06" filter="url(#nodeGlow)"/>

  <!-- Allowed output -->
  <path d="M 225,192 C 270,176 320,156 370,144" stroke="#38BDF8" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="370,144 354,137 356,153" fill="#38BDF8"/>
  <circle cx="370" cy="144" r="4" fill="#38BDF8"/>

  <!-- Denied output -->
  <path d="M 225,208 C 270,224 320,244 370,256" stroke="#4B5563" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-dasharray="8,6"/>
  <circle cx="370" cy="256" r="3" fill="#4B5563" opacity="0.7"/>

  <!-- Decision node -->
  <circle cx="210" cy="200" r="15" fill="#F59E0B"/>
  <circle cx="210" cy="200" r="9.5" fill="#111827"/>
  <circle cx="210" cy="200" r="5" fill="#F59E0B"/>

  <!-- Wordmark: "spec" in off-white, "rail" in blue -->
  <text x="430" y="218" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="600" letter-spacing="-1">
    <tspan fill="#F9FAFB">spec</tspan><tspan fill="#38BDF8">rail</tspan>
  </text>

  <!-- Tagline -->
  <text x="432" y="258" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#6B7280" letter-spacing="0.5">
    Runtime capability broker for agents
  </text>
</svg>
