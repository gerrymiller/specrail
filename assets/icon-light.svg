<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="#F9FAFB"/>

  <!-- Subtle horizontal track lines -->
  <g stroke="#E5E7EB" stroke-width="0.75" opacity="0.6">
    <line x1="0" y1="160" x2="512" y2="160"/>
    <line x1="0" y1="208" x2="512" y2="208"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="304" x2="512" y2="304"/>
    <line x1="0" y1="352" x2="512" y2="352"/>
  </g>

  <!-- Input rails converging to node -->
  <path d="M 48,176 C 130,176 170,222 240,240" stroke="#9CA3AF" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  <path d="M 48,256 L 240,256" stroke="#9CA3AF" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  <path d="M 48,336 C 130,336 170,290 240,272" stroke="#9CA3AF" stroke-width="5.5" fill="none" stroke-linecap="round"/>

  <!-- Allowed output (upper, bold blue) -->
  <path d="M 272,244 C 330,222 390,196 448,180" stroke="#0EA5E9" stroke-width="7" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="448,180 430,172 432,190" fill="#0EA5E9"/>
  <circle cx="448" cy="180" r="5" fill="#0EA5E9"/>

  <!-- Denied output (lower, dashed) -->
  <path d="M 272,268 C 330,290 390,316 448,332" stroke="#9CA3AF" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="10,7"/>
  <circle cx="448" cy="332" r="3.5" fill="#9CA3AF" opacity="0.7"/>

  <!-- Decision node rings -->
  <circle cx="256" cy="256" r="19" fill="#F59E0B"/>
  <circle cx="256" cy="256" r="12" fill="#F9FAFB"/>
  <circle cx="256" cy="256" r="6" fill="#F59E0B"/>
</svg>
