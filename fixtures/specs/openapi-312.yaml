openapi: '3.1.2'
info:
  title: Weather API (OpenAPI 3.1.2)
  version: '2.0.0'
  description: Minimal fixture to test OpenAPI 3.1.2 patch normalization
servers:
  - url: https://api.weather.example.com/v2
paths:
  /forecasts:
    get:
      operationId: getForecasts
      summary: Get weather forecasts
      description: Returns weather forecasts for a location.
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lon
          in: query
          required: true
          schema:
            type: number
      responses:
        '200':
          description: Forecast data
          content:
            application/json:
              schema:
                type: object
                properties:
                  forecasts:
                    type: array
                    items:
                      type: object
  /alerts:
    get:
      operationId: getAlerts
      summary: Get active weather alerts
      description: Returns active alerts for a given area.
      parameters:
        - name: area
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Active alerts
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items:
                      type: object
